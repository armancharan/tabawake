[package]
name = "tabawake_desktop"
version = "0.1.0"
description = "tabawake desktop host"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "tabawake_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
